<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a909c;
    --border: #e4e6eb;
    --accent: #4f7cff;
    --accent-weak: #eaf0ff;
    --danger: #ff5a5a;
    --done: #a7adba;
    --shadow: 0 6px 24px rgba(31, 36, 48, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c;
      --card: #1e2128;
      --text: #e8eaef;
      --muted: #8a909c;
      --border: #2c303a;
      --accent: #6b8cff;
      --accent-weak: #242a3d;
      --danger: #ff6b6b;
      --done: #5b616e;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 26px; font-weight: 700; }
  .count { font-size: 14px; color: var(--muted); }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #itemInput {
    flex: 1;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  #itemInput:focus { border-color: var(--accent); }
  #addBtn {
    padding: 0 20px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: opacity .15s;
  }
  #addBtn:hover { opacity: .9; }
  #addBtn:active { transform: scale(.97); }
  ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .check {
    width: 24px; height: 24px;
    flex-shrink: 0;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .check.done {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check.done::after {
    content: "";
    width: 6px; height: 11px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }
  .label {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .label {
    color: var(--done);
    text-decoration: line-through;
  }
  .del {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .del:hover { background: var(--accent-weak); color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 0;
    font-size: 15px;
  }
  footer {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }
  #clearDone {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
  }
  #clearDone:hover { color: var(--danger); background: var(--accent-weak); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑리스트</h1>
      <span class="count" id="count"></span>
    </header>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="살 것을 입력하세요…" autocomplete="off" maxlength="100">
      <button id="addBtn">추가</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <button id="clearDone">완료 항목 지우기</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = "shopping-list-items";
  const listEl = document.getElementById("list");
  const inputEl = document.getElementById("itemInput");
  const addBtn = document.getElementById("addBtn");
  const countEl = document.getElementById("count");
  const clearDoneBtn = document.getElementById("clearDone");

  let items = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) { /* 저장 불가 환경 무시 */ }
  }

  function addItem(text) {
    const value = text.trim();
    if (!value) return;
    items.push({ id: Date.now() + Math.random(), text: value, done: false });
    save();
    render();
  }

  function toggleItem(id) {
    const it = items.find(i => i.id === id);
    if (it) { it.done = !it.done; save(); render(); }
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function clearDone() {
    items = items.filter(i => !i.done);
    save();
    render();
  }

  function render() {
    listEl.innerHTML = "";

    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "아직 항목이 없어요. 위에서 추가해 보세요!";
      listEl.appendChild(empty);
    } else {
      items.forEach(item => {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const check = document.createElement("div");
        check.className = "check" + (item.done ? " done" : "");
        check.title = "완료 표시";
        check.addEventListener("click", () => toggleItem(item.id));

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item.text;
        label.addEventListener("click", () => toggleItem(item.id));

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "×";
        del.title = "삭제";
        del.addEventListener("click", () => deleteItem(item.id));

        li.append(check, label, del);
        listEl.appendChild(li);
      });
    }

    const remaining = items.filter(i => !i.done).length;
    countEl.textContent = items.length ? `남은 항목 ${remaining} / 전체 ${items.length}` : "";
    clearDoneBtn.style.display = items.some(i => i.done) ? "block" : "none";
  }

  addBtn.addEventListener("click", () => {
    addItem(inputEl.value);
    inputEl.value = "";
    inputEl.focus();
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      addItem(inputEl.value);
      inputEl.value = "";
    }
  });

  clearDoneBtn.addEventListener("click", clearDone);

  render();
  inputEl.focus();
</script>
</body>
</html>
